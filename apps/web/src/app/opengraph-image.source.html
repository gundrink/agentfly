  The source for `opengraph-image.png` and `twitter-image.png`.

  Kept beside the images it produced so the next person can change the words without
  reverse-engineering a PNG. It is not served: Next only treats `opengraph-image.*` and
  `twitter-image.*` as route files, and `.source.html` is neither.

  To regenerate, render it at 1200x630 and copy the result over both PNGs:

    chrome --headless --window-size=1200,630 --hide-scrollbars \
      --screenshot=opengraph-image.png apps/web/src/app/opengraph-image.source.html
-->
